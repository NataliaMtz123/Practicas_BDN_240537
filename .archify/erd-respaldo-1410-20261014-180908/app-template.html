<script>

const init=new Map();let pos=new Map(),expanded=new Set(),hidden=new Set(),selected=null,selectedRel=null,query='',scale=.82,tx=32,ty=82,drag=null,pan=null;

function height(t){return dims.head+dims.summary+(expanded.has(t.name)?Math.min(t.columns.length,14)*dims.row:Math.min(t.columns.length,4)*dims.row)+dims.foot}
function initLayout(){M.tables.forEach(t=>{const x=55+(t._col||0)*405,y=105+(t._row||0)*490;pos.set(t.name,{x,y});init.set(t.name,{x,y})})}

function matches(t){const q=query.toLowerCase();const text=[t.name,...t.columns.map(c=>c.name+' '+c.decl)].join(' ').toLowerCase();if(q&&!text.includes(q))return false;const f=document.getElementById('filter').value;if(f==='fk'&&!t.fks.length)return false;if(f==='none'&&relsFor(t.name).length)return false;if(f==='counted'&&M.counts[t.name]==null)return false;if(f==='associative'&&!((t.pk||[]).length>1&&t.fks.length>0))return false;const d=document.getElementById('domain').value;if(d!=='all'&&t._domain!==d)return false;return true}
function drawEdges(){edges.replaceChildren();for(const r of M.relationships){const a=pos.get(r.from),b=pos.get(r.to);if(!a||!b)continue;const ah=height(S.get(r.from)),bh=height(S.get(r.to)),ac={x:a.x+dims.w/2,y:a.y+ah/2},bc={x:b.x+dims.w/2,y:b.y+bh/2};let x1=ac.x,y1=ac.y,x2=bc.x,y2=bc.y;if(Math.abs(bc.x-ac.x)>Math.abs(bc.y-ac.y)){x1=ac.x+(bc.x>ac.x?dims.w/2:-dims.w/2);x2=bc.x+(bc.x>ac.x?-dims.w/2:dims.w/2)}else{y1=ac.y+(bc.y>ac.y?ah/2:-ah/2);y2=bc.y+(bc.y>ac.y?-bh/2:bh/2)}const mid=(x1+x2)/2;const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`);p.setAttribute('class','edge'+(r.identifying?'':' nonident')+(selectedRel===r.id?' selected':selected&&[r.from,r.to].includes(selected)?' connected':'')+(hidden.has(r.from)||hidden.has(r.to)?' dim':''));p.dataset.rel=r.id;p.onclick=e=>{e.stopPropagation();selectedRel=r.id;selected=null;renderDetails();draw()};edges.append(p);const label=document.createElementNS(NS,'text');label.setAttribute('x',mid);label.setAttribute('y',(y1+y2)/2-5);label.setAttribute('text-anchor','middle');label.setAttribute('class','edge-label');label.textContent=`${r.fromCardinality==='many'?'N':'1'}:${r.toCardinality==='many'?'N':'1'} · ${short(r.constraint||r.label,24)}`;edges.append(label)}}
function drawNodes(){nodes.replaceChildren();for(const t of M.tables){const p=pos.get(t.name),h=height(t);const fo=document.createElementNS(NS,'foreignObject');fo.setAttribute('x',p.x);fo.setAttribute('y',p.y);fo.setAttribute('width',dims.w);fo.setAttribute('height',h);fo.setAttribute('class','node');fo.dataset.name=t.name;const div=document.createElement('div');div.setAttribute('xmlns','http://www.w3.org/1999/xhtml');div.className='card'+(selected===t.name?' selected':'')+(!matches(t)||hidden.has(t.name)?' filtered':'');const cnt=M.counts[t.name];const shown=expanded.has(t.name)?t.columns:t.columns.slice(0,4);div.innerHTML=`<div class="cardhead"><span class="tableicon">▤</span><span class="tablename" title="${esc(t.name)}">${esc(t.name)}</span><span class="count">${cnt==null?'N/D':cnt.toLocaleString('es-MX')}</span><button class="toggle" aria-label="Expandir columnas">${expanded.has(t.name)?'−':'+'}</button></div><div class="summary"><span>${t.columns.length} columnas · ${t.pk?.length||0} PK · ${t.fks.reduce((n,f)=>n+f.columns.length,0)} FK</span><span>${relsFor(t.name).length} relaciones</span></div><div class="cols">${shown.map(c=>`<div class="colrow" data-col="${esc(c.name)}"><span class="keybadge ${c.keys?.includes('pk')?'pk':c.keys?.includes('fk')?'fk':c.keys?.includes('uk')?'uk':''}">${c.keys?.map(k=>k.toUpperCase()).join('/')||'·'}</span><span class="colname">${esc(c.name)}</span><span class="coltype">${esc(c.decl.split(/\s+/).slice(0,2).join(' '))}</span></div>`).join('')}</div>${!expanded.has(t.name)&&t.columns.length>4?`<div class="more">+ ${t.columns.length-4} columnas · selecciona para inspeccionar</div>`:''}`;fo.append(div);nodes.append(fo);div.querySelector('.toggle').onclick=e=>{e.stopPropagation();expanded.has(t.name)?expanded.delete(t.name):expanded.add(t.name);draw()};div.onclick=e=>{const row=e.target.closest('.colrow');selected=t.name;selectedRel=null;if(row)renderDetails(t,row.dataset.col);else renderDetails(t);draw()};const head=div.querySelec function field(c,t,i){const d=c.decl;const type=(d.match(/^[A-Za-z]+(?:\s*\([^)]*\))?(?:\s+unsigned)?/i)||[''])[0];const len=(type.match(/\(([^)]*)\)/)||[])[1]||'—';const nul=/\bNOT NULL\b/i.test(d)?'No':/\bNULL\b/i.test(d)?'Sí':'No especificado';const def=(d.match(/\bDEFAULT\s+((?:\([^)]*\))|(?:'[^']*(?:''[^']*)*')|(?:"[^"]*")|(?:[^\s,]+))/i)||[])[1]||'—';const comment=(d.match(/\bCOMMENT\s+'((?:''|[^'])*)'/i)||[])[1]?.replace(/''/g,"'")||'—';const ix=t.indexes.filter(x=>x.columns.includes(c.name));const fk=t.fks.filter(x=>x.columns.includes(c.name));return {name:c.name,type:type||d.split(' ')[0],length:len,nullable:nul,default:def,pk:(t.pk||[]).includes(c.name),fk:fk.length>0,refs:fk.map(x=>x.table+'.'+x.references[x.columns.indexOf(c.name)]).join(', ')||'—',unique:ix.some(x=>x.unique)||false,auto:/\bAUTO_INCREMENT\b/i.test(d),indexes:ix.map(x=>x.name+(x.unique?' (UNIQUE)':'')).join(', ')||'—',comment,position:i+1,decl:d}}
function renderDetails(t,col){const root=document.getElementById('details');if(selectedRel){const r=M.relationships.find(x=>x.id===selectedRel);if(!r)return;root.innerHTML=`<div class="pill">FOREIGN KEY EXPLÍCITA</div><h2>${esc(r.constraint||'Relación')}</h2><table class="info"><tr><td>Origen</td><td>${esc(r.from)}.${esc(r.columns.join(', '))}</td></tr><tr><td>Destino</td><td>${esc(r.to)}.${esc(r.references.join(', '))}</td></tr><tr><td>Cardinalidad</td><td>${r.fromCardinality}:${r.toCardinality}</td></tr><tr><td>Participación</td><td>${r.optional?'Origen opcional':'Origen obligatorio'}</td></tr><tr><td>ON DELETE</td><td>${esc(r.onDelete||'No declarado')}</td></tr><tr><td>ON UPDATE</td><td>${esc(r.onUpdate||'No declarado')}</td></tr></table><div class="warning">Restricción declarada en el respaldo SQL. No es una relación inferida.</div>`;return}if(!t){root.innerHTML=`<div class="stats">${[['Tablas',M.totals.tables],['Columnas',M.totals.columns],['Relaciones FK',M.totals.foreignKeys],['Claves primarias',M.totals.primaryKeys],['Índices',M.totals.indexes],['Filas del snapshot',M.totals.rows.toLocaleString('es-MX')],['Conteo disponible',M.totals.availableCounts],['Sin conteo',M.totals.unavailableCounts]].map(x=>`<div class="stat"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('')}</div><section class="section"><h2>Fuente y análisis</h2><table class="info"><tr><td>Archivo</td><td>${M.file}</td></tr><tr><td>Esquema</td><td>${M.schema}</td></tr><tr><td>Motor</td><td>${M.engine}</td></tr><tr><td>Procesado</td><td>${M.processedAt}</td></tr><tr><td>Conteos</td><td>Filas insertadas del snapshot SQL, no conteos vivos.</td></tr><tr><td>Relaciones inferidas</td><td>0</td></tr><tr><td>Procedimientos</td><td>${M.objects.procedures.join(', ')||'Ninguno detectado'}</td></tr><tr><td>Otros objetos</td><td>Vistas 0 · Triggers 0 · Funciones 0 · Eventos 0 · CHECK 0</td></tr></table></section><section class="section"><h2>Lectura del diagrama</h2><div class="legend"><span><b>PK</b> primaria</span><span><b>FK</b> foránea</span><span><b>UK</b> única</span><span>línea discontinua = FK no identificadora</span></div><p class="small">Arrastra una tarjeta para moverla. Arrastra el fondo para desplazar el lienzo; rueda del ratón para zoom. Haz clic en una tabla o línea para inspeccionarla.</p>${M.warnings.map(w=>`<div class="warning">${esc(w)}</div>`).join('')}</section>`;return}
const counts=M.counts[t.name];const fks=t.fks.map(f=>`<span class="pill">${esc(f.name||'FOREIGN KEY')}: ${esc(f.columns.join(', '))} → ${esc(f.table)}.${esc(f.references.join(', '))}</span>`).join('')||'<span class="small">Sin claves foráneas declaradas</span>';let attrs=t.columns.map((c,i)=>field(c,t,i));if(col)attrs=attrs.filter(a=>a.name===col);root.innerHTML=`<div class="pill">${esc(t._domain)}</div><h2>${esc(t.name)}</h2><p class="small">${t.columns.length} columnas · ${t.pk?.length||0} columnas PK · ${t.fks.reduce((n,f)=>n+f.columns.length,0)} columnas FK · ${counts.toLocaleString('es-MX')} filas en respaldo</p><section class="section"><h2>Restricciones y relaciones</h2>${fks}<p class="small">PK: ${esc(t.pk?.join(', ')||'—')}</p></section><section class="section"><h2>Índices (${t.indexes.length})</h2>${t.indexes.map(x=>`<div class="pill">${x.unique?'UNIQUE · ':''}${esc(x.name)} (${esc(x.columns.join(', '))})</div>`).join('')||'<span class="small">Sin índices adicionales</span>'}</section><section class="section"><h2>Columnas (${t.columns.length})</h2><div style="overflow:auto"><table class="colsdetail"><thead><tr><th>#</th><th>Columna</th><th>Tipo SQL</th><th>NULL</th><th>DEFAULT</th><th>PK/FK/UK</th></tr></thead><tbody>${attrs.map(a=>`<tr data-attribute="${esc(a.name)}"><td>${a.position}</td><td>${esc(a.name)}</td><td>${esc(a.type)} ${esc(a.length==='—'?'':a.length)}</td><td>${a.nullable}</td><td>${esc(a.default)}</td><td>${[a.pk&&'PK',a.fk&&'FK',a.unique&&'UK'].filter(Boolean).join('/')||'—'}</td></tr>`).join('')}</tbody></table></div>${attrs.map(a=>`<div class="section"><h2>${a.position}. ${esc(a.name)}</h2><table class="info"><tr><td>Tipo declarado</td><td>${esc(a.type)}</td></tr><tr><td>Longitud / precisión</td><td>${esc(a.length)}</td></tr><tr><td>Permite NULL</td><td>${a.nullable}</td></tr><tr><td>DEFAULT</td><td>${esc(a.default)}</td></tr><tr><td>Clave primaria</td><td>${a.pk?'Sí':'No'}</td></tr><tr><td>Clave foránea</td><td>${a.fk?'Sí':'No'}</td></tr><tr><td>Referencia</td><td>${esc(a.refs)}</td></tr><tr><td>UNIQUE</td><td>${a.unique?'Sí':'No'}</td></tr><tr><td>AUTO_INCREMENT</td><td>${a.auto?'Sí':'No'}</td></tr><tr><td>Índices</td><td>${esc(a.indexes)}</td></tr><tr><td>Comentario</td><td>${esc(a.comment)}</td></tr><tr><td>Posición</td><td>${a.position}</td></tr></table><div class="declaration">${esc(a.decl)}</div></div>`).join('')}</section>`;root.querySelectorAll('tr[data-attribute]').forEach(row=>row.onclick=()=>renderDetails(t,row.dataset.attribute));}
function setFilter(){drawNodes();drawEdges()}
function fit(){const w=canvas.clientWidth,h=canvas.clientHeight;const xs=[...pos.values()].map(p=>p.x),ys=[...pos.values()].map(p=>p.y);const maxX=Math.max(...xs)+dims.w+40,maxY=Math.max(...ys)+470;scale=Math.min(w/maxX,h/maxY,1);scale=Math.max(.22,scale);tx=(w-maxX*scale)/2;ty=(h-maxY*scale)/2+28;draw()}
function focus(name){const p=pos.get(name);if(!p)return;scale=Math.max(scale,.8);tx=canvas.clientWidth/2-(p.x+dims.w/2)*scale;ty=canvas.clientHeight/2-(p.y+height(S.get(name))/2)*scale;draw()}
initLayout();M.tables.forEach(t=>{const domain=Object.keys({'Carritos':1,'Catálogo':1,'Pedidos y pagos':1,'Usuarios y auditoría':1}).find(d=>d==='Carritos'&&['tb_carts','tbd_cart_items'].includes(t.name)||d==='Catálogo'&&['tb_products','tbc_categories','tbd_products_categories','tbd_products_users_providers','tbd_users_wishlist_products'].includes(t.name)||d==='Pedidos y pagos'&&['tbb_orders','tb_seller_orders','tbd_order_items','tb_payments','tb_payment_transactions'].includes(t.name)||d==='Usuarios y auditoría'&&['tb_users','tb_logs'].includes(t.name));t._domain=domain||'Otros';const dIndex={'Carritos':0,'Catálogo':1,'Pedidos y pagos':2,'Usuarios y auditoría':3}[t._domain];let list=M.tables.filter(x=>x._domain===t._domain);t._col=dIndex;t._row=list.indexOf(t)});
const domainSelect=document.getElementById('domain');[...new Set(M.tables.map(t=>t._domain))].forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;domainSelect.append(o)});
document.getElementById('search').oninput=e=>{query=e.target.value.trim();setFilter();if(query){const hit=M.tables.find(t=>matches(t));if(hit){selected=hit.name;renderDetails(hit);focus(hit.name)}}};document.getElementById('filter').onchange=e=>{if(['high','low'].includes(e.target.value)){M.tables.sort((a,b)=>(M.counts[b.name]-M.counts[a.name])*(e.target.value==='high'?1:-1))}setFilter()};domainSelect.onchange=setFilter;
document.getElementById('plus').onclick=()=>{scale=Math.min(2.1,scale*1.18);draw()};document.getElementById('minus').onclick=()=>{scale=Math.max(.2,scale/1.18);draw()};document.getElementById('fit').onclick=fit;document.getElementById('reset').onclick=()=>{pos=new Map([...init].map(([k,v])=>[k,{...v}]));expanded.clear();hidden.clear();selected=null;selectedRel=null;query='';document.getElementById('search').value='';document.getElementById('filter').value='all';domainSelect.value='all';renderDetails();fit()};document.getElementById('sideToggle').onclick=()=>document.getElementById('side').classList.toggle('open');
canvas.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;pan={x:e.clientX,y:e.clientY,tx,ty};canvas.classList.add('panning');canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!pan)return;tx=pan.tx+e.clientX-pan.x;ty=pan.ty+e.clientY-pan.y;draw()});canvas.addEventListener('pointerup',()=>{pan=null;canvas.classList.remove('panning')});canvas.addEventListener('wheel',e=>{e.preventDefault();const rect=canvas.getBoundingClientRect(),ox=e.clientX-rect.left,oy=e.clientY-rect.top,old=scale;scale=Math.max(.2,Math.min(2.1,scale*(e.deltaY<0?1.08:.92)));tx=ox-(ox-tx)*(scale/old);ty=oy-(oy-ty)*(scale/old);draw()},{passive:false});
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.getElementById('exportJson').onclick=()=>download('db_test-eer.json',JSON.stringify(M,null,2),'application/json');document.getElementById('exportSvg').onclick=()=>{const clone=canvas.cloneNode(true);clone.setAttribute('xmlns',NS);download('db_test-eer.svg',new XMLSerializer().serializeToString(clone),'image/svg+xml')};
renderDetails();document.getElementById('status').textContent=`${M.totals.tables} tablas · ${M.totals.foreignKeys} relaciones explícitas · ${M.totals.rows.toLocaleString('es-MX')} filas del snapshot`;draw();setTimeout(fit,60);window.addEventListener('resize',fit);
</script></body></html>
